name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check server
        run: cd services/server && npx tsc --noEmit

      - name: Type check extension
        run: cd apps/extension && npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Package extension
        if: github.event_name != 'pull_request'
        run: cd apps/extension/dist && zip -r ../../../meterx-extension.zip .

      - name: Upload extension
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: meterx-extension
          path: meterx-extension.zip
          retention-days: 14
