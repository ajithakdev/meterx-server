<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MeterX</title>
    <link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles/app.css">
    <link rel="stylesheet" href="styles/popup.css">
</head>
<body class="popup">
    <header class="bar">
        <span id="mark"></span>
        <div class="who">
            <div class="name">MeterX</div>
            <div class="scope" id="scope">Testing via Cloudflare edge</div>
        </div>
        <div class="tools">
            <button id="panelBtn" class="icon-btn" type="button" aria-label="Open history in the side panel" title="History and trend">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
            </button>
            <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings" title="Settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
            </button>
        </div>
    </header>

    <main>
        <section class="answer card" aria-labelledby="dlLabel">
            <div class="answer-top">
                <h1 id="dlLabel" class="label" data-tip="download">Download</h1>
                <span id="quality" class="pill is-empty">Quality</span>
            </div>
            <div class="figure-row" aria-live="polite">
                <span id="download" class="figure num dash">-</span><span class="unit">Mbps</span>
            </div>
            <p id="finding" class="finding">Run a test to see what this connection can handle.</p>
        </section>

        <dl class="strip card" aria-label="Other results">
            <div data-tip="upload"><dt>Upload</dt><dd><span id="upload" class="dash">-</span><span class="unit">Mbps</span></dd></div>
            <div data-tip="ping"><dt>Ping</dt><dd><span id="ping" class="dash">-</span><span class="unit">ms</span></dd></div>
            <div data-tip="jitter"><dt>Jitter</dt><dd><span id="jitter" class="dash">-</span><span class="unit">ms</span></dd></div>
            <div data-tip="packet-loss"><dt>Loss</dt><dd><span id="loss" class="dash">-</span><span class="unit">%</span></dd></div>
        </dl>

        <section class="card" aria-labelledby="loadTitle">
            <div class="card-head">
                <h2 id="loadTitle" data-tip="bufferbloat">Latency under load</h2>
                <span id="grade" class="pill is-empty">Grade</span>
            </div>
            <div class="card-body load-rows" id="loadRows">
                <div class="load-row idle"><span class="k">Idle</span><span class="track"><i></i></span><span class="v dash">-</span></div>
                <div class="load-row"><span class="k">Downloading</span><span class="track"><i></i></span><span class="v dash">-</span></div>
                <div class="load-row"><span class="k">Uploading</span><span class="track"><i></i></span><span class="v dash">-</span></div>
            </div>
        </section>

        <section class="card" aria-labelledby="readyTitle">
            <div class="card-head"><h2 id="readyTitle">Good enough for</h2></div>
            <ul class="card-body ready" id="ready"></ul>
        </section>
    </main>

    <footer class="actions">
        <div class="progress" id="progress" role="progressbar" aria-label="Test progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span class="progress-track"><i id="progressFill"></i></span>
        </div>
        <button id="runBtn" class="btn btn-primary btn-wide" type="button">Run test</button>
        <div class="foot">
            <p id="status" class="status" role="status">No tests yet</p>
            <div class="foot-tools">
                <button id="shareBtn" class="btn btn-text" type="button">Share</button>
                <div class="menu-wrap">
                    <button id="exportBtn" class="btn btn-text" type="button" aria-haspopup="menu" aria-expanded="false">Export</button>
                    <div id="exportMenu" class="menu" role="menu" hidden>
                        <button type="button" role="menuitem" data-value="pdf">PDF report<small>Summary, trend and every result</small></button>
                        <button type="button" role="menuitem" data-value="csv">CSV<small>For spreadsheets</small></button>
                        <button type="button" role="menuitem" data-value="json">JSON<small>Every field</small></button>
                    </div>
                </div>
            </div>
        </div>
    </footer>
    <script src="popup.js"></script>
</body>
</html>
